spring.application.name=orthanc-scan-consumer
server.port=3001

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.scans.exchange=orthanc.scans
app.scans.queue=orthanc.scans
app.scans.routing-key=scan.created

# File-backed so lot-stage edits (and stored scans) survive restarts. AUTO_SERVER lets a second
# process (another app instance, an IDE database tool) open the same file.
spring.datasource.url=jdbc:h2:file:./data/orthanc-consumer;AUTO_SERVER=TRUE
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

spring.mvc.problemdetails.enabled=true

app.cors.allowed-origins=http://localhost:4200
