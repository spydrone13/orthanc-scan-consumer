spring.application.name=orthanc-scan-consumer
server.port=3001

# RabbitMQ credentials live in the git-ignored application-secrets.properties (see README); it
# overrides the guest defaults below when present.
spring.config.import=optional:classpath:application-secrets.properties

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.scans.exchange=orthanc.scans
app.scans.queue=orthanc.scans
app.scans.routing-key=scan.created
# Where scans go once the listener gives up on them (must match the producer's settings).
app.scans.dead-letter-exchange=orthanc.scans.dlx
app.scans.dead-letter-queue=orthanc.scans.dlq

# A failing scan is retried in-process (each attempt in its own rolled-back transaction), then
# rejected without requeue so it's dead-lettered.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# File-backed so lot-stage edits (and stored scans) survive restarts. AUTO_SERVER lets a second
# process (another app instance, an IDE database tool) open the same file.
spring.datasource.url=jdbc:h2:file:./data/orthanc-consumer;AUTO_SERVER=TRUE
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

spring.mvc.problemdetails.enabled=true

app.cors.allowed-origins=http://localhost:4200
