<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lot Stages</title>
  <link rel="stylesheet" href="/css/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/css/lot-stages.css">
  <script type="module" src="/js/lot-stages.js"></script>
</head>
<body>
  <main class="page container-fluid">
    <div class="card page-card mx-auto">
      <div class="card-body">
        <h1 class="card-title h4 fw-semibold">Lot Stages</h1>
        <p class="intro small text-body-secondary">
          Each stage lists the stages a lot can move to next and the WIP locations within it.
          Changes apply to scanning immediately.
        </p>

        <div class="toolbar d-flex flex-wrap align-items-center">
          <label class="search">
            <span class="visually-hidden">Filter stages</span>
            <input id="filter" class="form-control" type="search" placeholder="Filter by stage or WIP location" autocomplete="off">
          </label>
          <span id="count" class="count small text-body-tertiary" aria-live="polite"></span>
        </div>

        <div id="status" class="status" role="status"></div>

        <div class="table-wrap table-responsive border rounded-3" id="table-wrap" hidden>
          <table class="table mb-0">
            <thead>
              <tr>
                <th scope="col">Stage</th>
                <th scope="col">Valid next stages</th>
                <th scope="col">WIP locations</th>
                <th scope="col"><span class="visually-hidden">Actions</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p id="no-match" class="small text-body-tertiary mt-3" hidden>No stages match the filter.</p>
      </div>
    </div>
  </main>
</body>
</html>
