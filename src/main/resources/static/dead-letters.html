<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Failed Scans</title>
  <link rel="stylesheet" href="/css/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/css/lot-stages.css">
  <script type="module" src="/js/dead-letters.js"></script>
</head>
<body>
  <main class="page container-fluid">
    <div class="card page-card mx-auto">
      <div class="card-body">
        <h1 class="card-title h4 fw-semibold">Failed Scans</h1>
        <p class="intro small text-body-secondary">
          Scans the consumer gave up on after retrying. Fix the cause, then retry them; scans already
          applied are skipped. Discard removes a scan for good.
        </p>

        <div class="toolbar d-flex flex-wrap align-items-center">
          <span id="count" class="count small text-body-tertiary" aria-live="polite"></span>
          <span class="toolbar-actions ms-auto d-flex gap-2">
            <button id="refresh" type="button" class="btn btn-sm btn-outline-secondary">Refresh</button>
            <button id="retry-all" type="button" class="btn btn-sm btn-primary" disabled>Retry all</button>
          </span>
        </div>

        <div id="status" class="status" role="status"></div>

        <div class="table-wrap table-responsive border rounded-3" id="table-wrap" hidden>
          <table class="table mb-0">
            <thead>
              <tr>
                <th scope="col">Scan</th>
                <th scope="col">Lot</th>
                <th scope="col">User</th>
                <th scope="col">Failed</th>
                <th scope="col">Reason</th>
                <th scope="col"><span class="visually-hidden">Actions</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p id="empty" class="small text-body-tertiary mt-3" hidden>No failed scans.</p>
      </div>
    </div>
  </main>
</body>
</html>
